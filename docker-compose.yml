services:
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-backend
    restart: always
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
    ports:
      - "8000:8000"
    volumes:
      - ./vector_store:/app/vector_store
      - ./data:/app/data
      - C:/Users/Lenovo/.cache/huggingface:/root/.cache/huggingface

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: rag-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"